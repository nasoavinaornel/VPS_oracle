name: Create Oracle VPS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  try-create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${OCI_PRIVATE_KEY}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=~/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}

      - name: Diagnostic clé API
        run: |
          echo "--- Nombre de lignes dans key.pem ---"
          wc -l ~/.oci/key.pem
          echo "--- Première ligne (30 premiers caractères) ---"
          head -1 ~/.oci/key.pem | cut -c1-30
          echo "--- Dernière ligne (30 premiers caractères) ---"
          tail -1 ~/.oci/key.pem | cut -c1-30
          echo "--- Fingerprint calculé depuis la clé ---"
          openssl rsa -pubout -outform DER -in ~/.oci/key.pem 2>/dev/null | openssl md5 -c
          echo "--- Fingerprint attendu (secret) ---"
          echo "${OCI_FINGERPRINT}"
        env:
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}

      - name: Try create instance
        id: attempt
        run: bash scripts/create-instance.sh | tee result.log
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Disable workflow if success
        if: contains(steps.attempt.outputs.stdout, 'SUCCESS') || success()
        run: |
          if grep -q "SUCCESS" result.log; then
            curl -s -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/create-vps.yml/disable"
          fi
